<!DOCTYPE html>
<html lang="es">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-T2FYW0HDYD"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-T2FYW0HDYD');
    </script>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Transparencia - Edificio F</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-slate-100 text-slate-900 font-sans pb-10">

    <header class="bg-indigo-800 text-white shadow-xl sticky top-0 z-50">
        <div class="max-w-5xl mx-auto p-4 sm:p-6">
            <div class="flex flex-col sm:flex-row justify-between items-center gap-6">
                <div class="text-center sm:text-left">
                    <h1 class="text-2xl font-black tracking-tight">Edificio F</h1>
                    <div class="flex flex-col sm:flex-row sm:items-center gap-2 mt-1">
                        <div id="mes-actual" class="text-indigo-200 text-xs uppercase font-bold tracking-widest bg-indigo-900/40 px-2 py-0.5 rounded-md inline-block">
                            MARZO
                        </div>
                        <div id="fecha-actualizacion" class="text-indigo-300 text-[10px] font-bold uppercase tracking-tight flex items-center justify-center sm:justify-start gap-1.5">
                            <i class="fas fa-history opacity-70"></i> 
                            <span id="txt-actualizacion">ACTUALIZANDO...</span>
                        </div>
                    </div>
                </div>
                <div class="flex flex-col sm:flex-row gap-4">
                    <div class="bg-indigo-700/60 px-4 py-2 sm:px-6 sm:py-3 rounded-2xl border border-indigo-400/40 shadow-inner text-center">
                        <span class="block text-[9px] sm:text-[10px] uppercase text-indigo-300 font-bold tracking-widest mb-1">Fondo Recolectado</span>
                        <span id="gran-total-edificio" class="text-xl sm:text-2xl font-black text-white">$0</span>
                    </div>
                    <div class="bg-emerald-700/60 px-4 py-2 sm:px-6 sm:py-3 rounded-2xl border border-emerald-400/40 shadow-inner text-center min-w-[200px]">
                        <span class="block text-[9px] sm:text-[10px] uppercase text-emerald-300 font-bold tracking-widest mb-1 text-center">Fondo Pozo Profundo</span>
                        <div class="flex items-center justify-center gap-3">
                            <span id="total-pozo-recolectado" class="text-xl sm:text-2xl font-black text-white">$0</span>
                            <span id="porcentaje-pozo-global" class="bg-emerald-500 text-white text-[10px] px-2 py-0.5 rounded-full font-black shadow-sm">0%</span>
                        </div>
                        <div class="w-full bg-emerald-900/40 rounded-full h-1.5 mt-2 overflow-hidden border border-emerald-500/20">
                            <div id="barra-pozo-global" class="bg-emerald-400 h-full transition-all duration-1000 shadow-[0_0_8px_rgba(52,211,153,0.5)]" style="width: 0%"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto p-4 space-y-8">

        <section id="seccion-calendario" class="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden"></section>

        <section class="space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="bg-white p-5 rounded-2xl shadow-sm border-l-4 border-l-blue-500 border border-slate-200">
                    <span class="text-[10px] font-black text-blue-600 uppercase tracking-widest block mb-1">Cuota de Mantenimiento</span>
                    <p class="text-sm font-bold text-slate-700">$170.00 Mensuales</p>
                </div>
                </div>

            <div class="bg-white border-2 border-indigo-100 rounded-2xl p-6 shadow-sm">
                <div class="flex flex-col md:flex-row items-center justify-between gap-6">
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center text-xl">
                            <i class="fas fa-university"></i>
                        </div>
                        <div>
                            <h4 class="text-xs font-black text-indigo-800 uppercase tracking-widest leading-none">Datos para Depósito</h4>
                            <p class="text-lg font-black text-slate-800 mt-1">Virna Díaz Velásquez</p>
                        </div>
                    </div>
                    <div class="bg-indigo-50 px-4 py-2 rounded-xl border border-indigo-200 flex justify-between items-center gap-4">
                        <span id="num-tarjeta" class="text-sm font-mono font-bold text-indigo-800 tracking-wider">5579 1001 3565 7797</span>
                        <button onclick="copiarTarjeta()" id="btn-copiar" class="bg-white text-indigo-600 p-2 rounded-lg border border-indigo-200">
                            <i class="fas fa-copy"></i>
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6" id="contenedor-unidades"></div>

    </main>

    <script>
        const URL_CUOTAS = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSMQOCU1LLf-l3ipsDUYpkSoyrW8EmnYvU8BtPJXYkUv59IngKwUGjbQSeQxY3GieD8WjxnXU62WUJ_/pub?gid=670752080&single=true&output=csv";

        async function cargarDatos() {
            try {
                const respuesta = await fetch(URL_CUOTAS);
                const texto = await respuesta.text();
                const filas = texto.split('\n').slice(1);
                
                const contenedor = document.getElementById('contenedor-unidades');
                contenedor.innerHTML = '';

                let sumaGeneralEdificio = 0;
                let sumaPozoEdificio = 0;

                filas.forEach(fila => {
                    const col = fila.split(',');
                    if (col[0]) {
                        const depto = col[0].trim();
                        const vecino = col[1] || "Residente";
                        const aguaPagado = col[2]?.trim().toLowerCase() === 'pagado';
                        const fechaAgua = col[3] || "N/A";
                        const rioPagado = col[5]?.trim().toLowerCase() === 'pagado';
                        const fechaRio = col[6] || "N/A";
                        
                        // Plan B y Multas
                        const s1 = parseFloat(col[10]) || 0;
                        const s2 = parseFloat(col[11]) || 0;
                        const s3 = parseFloat(col[12]) || 0;
                        const totalPlanB = s1 + s2 + s3;
                        const multaMonto = parseFloat(col[13]) || 0;
                        const multaEstatus = col[15]?.trim().toLowerCase() === 'pagado';
                        
                        // Pozo
                        const abonoPozo = parseFloat(col[16]) || 0;
                        const metaPozoIndividual = 6000;
                        const porcPozo = Math.min((abonoPozo / metaPozoIndividual) * 100, 100);

                        // Cálculo Total Abonado
                        let totalAbonadoVecino = (aguaPagado ? 170 : 0) + totalPlanB + (multaEstatus ? multaMonto : 0) + abonoPozo;
                        
                        sumaGeneralEdificio += (aguaPagado ? 170 : 0) + totalPlanB + (multaEstatus ? multaMonto : 0);
                        sumaPozoEdificio += abonoPozo;

                        // Construcción de la Tarjeta (DISEÑO ORIGINAL)
                        const tarjeta = document.createElement('div');
                        tarjeta.className = "bg-white rounded-[40px] shadow-sm border border-slate-100 overflow-hidden flex flex-col transition-all hover:shadow-md";
                        tarjeta.innerHTML = `
                            <div class="p-6 flex justify-between items-start">
                                <div>
                                    <p class="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] mb-1">Departamento</p>
                                    <h3 class="text-5xl font-black text-slate-800 tracking-tighter">${depto}</h3>
                                </div>
                                <div class="text-right">
                                    <p class="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] mb-1">Abonado Total</p>
                                    <div class="text-4xl font-black text-indigo-600 tracking-tighter">$${totalAbonadoVecino}</div>
                                </div>
                            </div>

                            <div class="px-6 grid grid-cols-2 gap-3 mb-4">
                                <div class="p-4 rounded-3xl bg-slate-50 border border-slate-100 text-center">
                                    <p class="text-[9px] font-black text-slate-400 uppercase mb-1">Agua ($170)</p>
                                    <span class="text-[10px] font-black ${aguaPagado ? 'text-green-600' : 'text-red-600'} flex items-center justify-center gap-1">
                                        <i class="fas fa-check-circle"></i> ${aguaPagado ? 'PAGADO' : 'PENDIENTE'}
                                    </span>
                                    <p class="text-[8px] text-slate-400 font-bold mt-1 uppercase">Fecha: ${fechaAgua}</p>
                                </div>
                                <div class="p-4 rounded-3xl bg-slate-50 border border-slate-100 text-center">
                                    <p class="text-[9px] font-black text-slate-400 uppercase mb-1">Río ($0)</p>
                                    <span class="text-[10px] font-black ${rioPagado ? 'text-green-600' : 'text-red-600'} flex items-center justify-center gap-1">
                                        <i class="fas fa-check-circle"></i> ${rioPagado ? 'PAGADO' : 'PENDIENTE'}
                                    </span>
                                    <p class="text-[8px] text-slate-400 font-bold mt-1 uppercase">Fecha: ${fechaRio}</p>
                                </div>
                            </div>

                            <div class="px-6 pb-4">
                                <div class="bg-indigo-50/50 border border-indigo-100 rounded-2xl p-4">
                                    <div class="flex justify-between items-center mb-1">
                                        <h4 class="text-[9px] font-black uppercase text-indigo-600 tracking-widest">Cooperación Pozo Profundo</h4>
                                        <span class="text-sm font-black text-indigo-700">$${abonoPozo}</span>
                                    </div>
                                    <div class="w-full bg-slate-200 rounded-full h-1.5 mb-2 overflow-hidden">
                                        <div class="bg-indigo-500 h-full" style="width: ${porcPozo}%"></div>
                                    </div>
                                    <div class="flex justify-between text-[8px] font-bold text-slate-400 uppercase">
                                        <span>Faltan: $${6000 - abonoPozo}</span>
                                        <span>${Math.round(porcPozo)}%</span>
                                    </div>
                                </div>
                            </div>

                            ${totalPlanB > 0 ? `
                            <div class="px-6 pb-4">
                                <div class="bg-blue-50 border-blue-100 border rounded-2xl p-4">
                                    <h4 class="text-[9px] font-black uppercase text-blue-600 mb-2 tracking-widest"><i class="fas fa-truck-moving"></i> Plan B (Pipas)</h4>
                                    <div class="flex justify-between text-xs font-black text-blue-800">
                                        <span>Total Pagado:</span>
                                        <span>$${totalPlanB}</span>
                                    </div>
                                </div>
                            </div>` : ''}

                            <div class="mt-auto bg-slate-50 p-4 flex items-center gap-3 border-t border-slate-100">
                                <div class="w-8 h-8 rounded-full bg-white flex items-center justify-center shadow-sm text-xs">👤</div>
                                <span class="text-[10px] font-bold text-slate-500 uppercase">Residente: ${vecino}</span>
                            </div>
                        `;
                        contenedor.appendChild(tarjeta);
                        
                        // Actualizar fecha de actualización si existe en la columna J (índice 9)
                        if(col[9] && col[9] !== '-') document.getElementById('txt-actualizacion').textContent = col[9];
                    }
                });

                // Actualizar contadores superiores
                document.getElementById('gran-total-edificio').textContent = `$${sumaGeneralEdificio.toLocaleString()}`;
                document.getElementById('total-pozo-recolectado').textContent = `$${sumaPozoEdificio.toLocaleString()}`;
                const porcGlobal = Math.min((sumaPozoEdificio / 6000) * 100, 100);
                document.getElementById('barra-pozo-global').style.width = `${porcGlobal}%`;
                document.getElementById('porcentaje-pozo-global').textContent = `${Math.round(porcGlobal)}%`;

            } catch (e) { console.error(e); }
        }

        function copiarTarjeta() {
            const num = document.getElementById('num-tarjeta').innerText.replace(/\s/g, '');
            navigator.clipboard.writeText(num);
            alert("Número copiado");
        }

        window.onload = () => {
            cargarDatos();
            // Aquí puedes llamar a generarCalendarioAutomatico() si lo deseas
        };
    </script>
</body>
</html>
